<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confronto turni — vecchi e nuovi</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#0d1117;--p:#141b24;--p2:#1a2330;--amber:#ffb020;--cyan:#4fd3c4;--red:#ff6b5e;--ink:#e8ecf1;--dim:#8b97a6;--line:#25303d;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Iowan Old Style',ui-serif,serif;min-height:100vh}
.mono{font-family:'SFMono-Regular','IBM Plex Mono',Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 80px}
header{border-bottom:2px solid var(--line);padding-bottom:16px;margin-bottom:22px}
h1{margin:0;font-size:28px;font-weight:600}
h1 span{color:var(--amber)}
header p{margin:4px 0 0;color:var(--dim);font:13.5px system-ui,sans-serif}
.drops{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.drops{grid-template-columns:1fr}}
.dz{border:1.5px dashed #33404f;border-radius:var(--r);background:var(--p);padding:26px 16px;text-align:center;cursor:pointer;font-family:system-ui,sans-serif;transition:border-color .15s}
.dz.drag{border-color:var(--amber);background:var(--p2)}
.dz.ok{border-style:solid;border-color:var(--cyan)}
.dz h3{margin:0 0 4px;font:600 17px Georgia,serif}
.dz p{margin:0;color:var(--dim);font-size:12.5px;word-break:break-all}
.dz input{display:none}
#status{margin-top:12px;font:12.5px 'SFMono-Regular',monospace;color:var(--cyan);min-height:18px}
#status.err{color:var(--red)}
#summary{display:none;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:24px 0 18px}
@media(max-width:760px){#summary{grid-template-columns:repeat(3,1fr)}}
.sc{background:var(--p);padding:14px 12px;font-family:system-ui,sans-serif}
.sc .k{font-size:11px;color:var(--dim)}
.sc .v{font:24px 'SFMono-Regular',monospace;margin-top:4px}
.v.add{color:var(--cyan)}.v.rem{color:var(--red)}.v.mod{color:var(--amber)}
#controls{display:none;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-family:system-ui,sans-serif}
#controls button,#controls input{background:var(--p);border:1px solid var(--line);color:var(--ink);padding:8px 12px;border-radius:6px;font-size:13px;cursor:pointer}
#controls button.on{border-color:var(--amber);color:var(--amber)}
#controls input{cursor:text;width:170px}
#controls .cnt{margin-left:auto;color:var(--dim);font-size:12.5px;cursor:default}
#list{display:grid;gap:12px}
.row{background:var(--p);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:var(--r);padding:14px 16px}
.row.added{border-left-color:var(--cyan)}.row.removed{border-left-color:var(--red)}
.rh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rh .id{font:20px 'SFMono-Regular',monospace;letter-spacing:1px}
.tag{font:11px system-ui,sans-serif;padding:3px 9px;border-radius:20px;border:1px solid currentColor}
.added .tag{color:var(--cyan)}.removed .tag{color:var(--red)}.modified .tag{color:var(--amber)}
.diffs{margin-top:10px;font-family:system-ui,sans-serif;font-size:13px}
.drow{display:grid;grid-template-columns:150px 1fr 1fr 80px;gap:8px;padding:5px 0;border-top:1px solid #1c242e;align-items:baseline}
@media(max-width:640px){.drow{grid-template-columns:1fr 1fr}.drow span:first-child{grid-column:1/-1;color:var(--dim)}}
.drow .o{color:var(--red)}.drow .n{color:var(--cyan)}.drow .d{color:var(--amber);text-align:right}
.legs{margin-top:12px;font:11.5px 'SFMono-Regular',monospace;overflow-x:auto}
.legs div{padding:3px 6px;border-radius:3px;margin-bottom:2px;white-space:nowrap}
.legs .lo{background:rgba(255,107,94,.12);color:var(--red)}
.legs .ln{background:rgba(79,211,196,.12);color:var(--cyan)}
.legs h4{margin:0 0 4px;font:600 12px system-ui,sans-serif;color:var(--dim)}
.sub{font:12.5px system-ui,sans-serif;color:var(--dim);margin-top:6px}
footer{margin-top:40px;text-align:center;color:var(--dim);font:11.5px system-ui,sans-serif}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Confronto <span>turni</span></h1>
  <p>Carica il PDF dei turni vecchi e quello dei turni nuovi: vedi subito cosa è cambiato. Tutto resta nel tuo browser.</p>
</header>

<div class="drops">
  <label class="dz" id="dz-old"><h3>Turni vecchi</h3><p>Trascina il PDF o clicca per sceglierlo</p><input type="file" accept="application/pdf"></label>
  <label class="dz" id="dz-new"><h3>Turni nuovi</h3><p>Trascina il PDF o clicca per sceglierlo</p><input type="file" accept="application/pdf"></label>
</div>
<div id="status"></div>

<div id="summary"></div>
<div id="controls">
  <button data-f="all" class="on">Tutti i cambiamenti</button>
  <button data-f="modified">Modificati</button>
  <button data-f="added">Aggiunti</button>
  <button data-f="removed">Rimossi</button>
  <input type="text" id="q" placeholder="Cerca turno (es. D001)">
  <span class="cnt" id="cnt"></span>
</div>
<div id="list"></div>
<footer>Documento non ufficiale — elaborazione automatica a scopo di analisi.<br>© 2026 Rino Lazzano &nbsp;-&nbsp; Tutti i diritti riservati</footer>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=id=>document.getElementById(id);
const state={old:null,new:null};
let rows=[],filter='all';

function setStatus(m,e){const s=$('status');s.textContent=m||'';s.classList.toggle('err',!!e)}

['old','new'].forEach(key=>{
  const dz=$('dz-'+key),inp=dz.querySelector('input');
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag')});
  dz.addEventListener('dragleave',()=>dz.classList.remove('drag'));
  dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag');if(e.dataTransfer.files.length)load(e.dataTransfer.files[0],key)});
  inp.addEventListener('change',e=>{if(e.target.files.length)load(e.target.files[0],key)});
});

async function load(file,key){
  if(!file.name.toLowerCase().endsWith('.pdf')&&file.type!=='application/pdf'){setStatus('Il file selezionato non è un PDF.',true);return}
  const dz=$('dz-'+key);
  try{
    setStatus(`Lettura di "${file.name}"…`);
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    const blocks=await extractColumnBlocks(pdf,f=>setStatus(`Estrazione testo (${key==='old'?'vecchi':'nuovi'}) — ${Math.round(f*100)}%`));
    const res=blocks.map(parseBlock).filter(r=>r!==null);
    if(!res.length){setStatus(`Nessun turno riconosciuto in "${file.name}". Controlla che sia il PDF giusto.`,true);return}
    state[key]=new Map(res.map(r=>[r.turno,r]));
    dz.classList.add('ok');
    dz.querySelector('p').textContent=`${file.name} — ${res.length} turni`;
    if(state.old&&state.new){compare();setStatus(`Confronto completato.`)}
    else setStatus(`Caricato. Manca il PDF dei turni ${key==='old'?'nuovi':'vecchi'}.`);
  }catch(err){console.error(err);setStatus('Errore durante l\'elaborazione: '+err.message,true)}
}

// ---------- estrazione PDF (stessa logica dell'analisi turni) ----------
async function extractColumnBlocks(pdf,onProgress){
  const blocks=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p),vp=page.getViewport({scale:1}),content=await page.getTextContent();
    const mid=vp.width*0.481;
    const items=content.items.filter(it=>it.str&&it.str.trim()!=='').map(it=>{const c=pdfjsLib.Util.transform(vp.transform,it.transform);return{text:it.str,x:c[4],y:c[5]}});
    blocks.push({text:linesFromWords(items.filter(i=>i.x<mid))});
    blocks.push({text:linesFromWords(items.filter(i=>i.x>=mid))});
    onProgress(p/pdf.numPages);
  }
  return blocks;
}
function linesFromWords(words,tol){
  tol=tol||2.6;
  const sorted=words.slice().sort((a,b)=>(a.y-b.y)||(a.x-b.x));
  const lines=[];let cur=[],curY=null;
  for(const w of sorted){
    if(curY===null||Math.abs(w.y-curY)<=tol){cur.push(w);if(curY===null)curY=w.y}
    else{lines.push(cur);cur=[w];curY=w.y}
  }
  if(cur.length)lines.push(cur);
  return lines.map(ln=>{ln.sort((a,b)=>a.x-b.x);return ln.map(w=>w.text.trim()).filter(Boolean).join(' ')}).join('\n');
}
function toMinColon(s){const[h,m]=s.split(':').map(Number);return h*60+m}
function toMinDot(s){const p=s.split('.');return parseInt(p[0],10)*60+parseInt(p[1],10)}
function rollFwd(v,ref){while(v<ref)v+=1440;return v}
function mmHHMM(m){if(m===null||m===undefined)return '';const s=m<0?'-':'';m=Math.round(Math.abs(m));return `${s}${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`}
function clockLabel(a){const d=Math.floor(a/1440),m=((a%1440)+1440)%1440;let s=`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;if(d>0)s+=` (+${d}g)`;return s}
function cleanDesc(raw){let s=raw.replace(/^\d{4}\s+/,'');s=s.replace(/\d{1,2}\.\d{2}\s+\d{1,2}\.\d{2}/,'');s=s.replace(/\d+,\d{2}\s*$/,'');return s.replace(/\s{2,}/g,' ').trim()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function parseBlock(block){
  const text=block.text.replace(/Smonta(?=[A-Z])/g,'Smonta ');
  const lines=text.split('\n');
  let tid=null;
  for(let i=0;i<Math.min(6,lines.length);i++){if(/^D\d{3}$/.test(lines[i].trim())){tid=lines[i].trim();break}}
  if(!tid)return null;
  let monta=null,smonta=null,deposito=null;
  for(const ln of lines){
    if(ln.trim().startsWith('Monta ')&&ln.includes('Smonta')){
      const toks=ln.split(/\s+/).filter(Boolean),sidx=toks.indexOf('Smonta');
      if(sidx>0){monta=toks.slice(1,sidx).join(' ');deposito=toks[toks.length-1];smonta=toks.slice(sidx+1,toks.length-1).join(' ')}
      break;
    }
  }
  let orarioTimes=[],seg='';
  const oIdx=lines.findIndex(l=>l.trim()==='Orario'||l.trim().startsWith('Orario '));
  if(oIdx!==-1){
    let c=lines[oIdx].replace(/^Orario\s*/,'').trim(),li=oIdx;
    while(c===''&&li+1<lines.length){li++;c=lines[li].trim()}
    seg=c;orarioTimes=c.match(/\d{1,2}:\d{2}/g)||[];
  }
  if(!orarioTimes.length)return null;
  const kmm=text.match(/NOTE\s+KM\s+([\d.]+,\d{2})/);
  const kmTot=kmm?kmm[1]:null;
  let headerIdx=-1,noteIdx=-1;
  for(let i=0;i<lines.length;i++){
    if(/^TA\s+DA\s+A\s+LIN/.test(lines[i]))headerIdx=i;
    if(headerIdx!==-1&&i>headerIdx&&/^NOTE(\s+KM.*)?$/.test(lines[i].trim())){noteIdx=i;break}
  }
  if(headerIdx===-1||noteIdx===-1)return null;
  const tableLines=lines.slice(headerIdx+1,noteIdx),tableText=tableLines.join('\n');
  const isRiserva=tableText.includes('RISERVA');
  const om=[toMinColon(orarioTimes[0])];
  for(let i=1;i<orarioTimes.length;i++)om.push(rollFwd(toMinColon(orarioTimes[i]),om[om.length-1]));
  const pieces=[];
  for(let i=0;i+1<om.length;i+=2)pieces.push([om[i],om[i+1]]);
  const netto=pieces.reduce((s,p)=>s+(p[1]-p[0]),0);
  const lordo=om.length>=2?(om[om.length-1]-om[0]):null;
  const interr=lordo!==null?(lordo-netto):null;
  const pairRe=/(\d{1,2}\.\d{2})\s+(\d{1,2}\.\d{2})/g,singleRe=/(\d{1,2}\.\d{2})/g;
  const consumed=[],tokens=[];let m;
  while((m=pairRe.exec(tableText))!==null){tokens.push({type:'pair',s:m[1],e:m[2],pos:m.index});consumed.push([m.index,m.index+m[0].length])}
  while((m=singleRe.exec(tableText))!==null){
    const p=m.index;
    if(!consumed.some(([a,b])=>a<=p&&p<b))tokens.push({type:'single',t:m[1],pos:p});
  }
  tokens.sort((a,b)=>a.pos-b.pos);
  const spans=[];{let off=0;for(const ln of tableLines){spans.push([off,off+ln.length,ln]);off+=ln.length+1}}
  const lineForPos=p=>{for(const[a,z,ln]of spans)if(a<=p&&p<=z)return ln.trim();return ''};
  let cur=om[0],guida=0;const legs=[];
  for(const t of tokens){
    if(t.type==='pair'){
      const s=rollFwd(toMinDot(t.s),cur),e=rollFwd(toMinDot(t.e),s),dur=e-s;
      guida+=dur;legs.push({s,e,dur,raw:lineForPos(t.pos)});cur=e;
    }else cur=rollFwd(toMinDot(t.t),cur);
  }
  if(isRiserva)guida=0;
  const sosta=Math.max(0,netto-guida);
  return{turno:tid,monta,smonta,deposito,orario_raw:orarioTimes.join(' / '),turno_netto_min:netto,interruzione_min:interr,guida_min:guida,sosta_min:sosta,km_pdf:kmTot,is_riserva:isRiserva,legs};
}

// ---------- confronto ----------
const FIELDS=[
  ['orario_raw','Orario'],['deposito','Deposito'],['monta','Monta'],['smonta','Smonta'],
  ['turno_netto_min','Durata turno','min'],['guida_min','Guida effettiva','min'],['sosta_min','Sosta / attesa','min'],
  ['interruzione_min','Interruzione','min'],['km_pdf','Km'],['is_riserva','Tipo','tipo']
];
function fmt(v,kind){
  if(kind==='min')return v?mmHHMM(v):'—';
  if(kind==='tipo')return v?'Riserva':'Servizio';
  return v||'—';
}
const legKey=l=>`${clockLabel(l.s)}–${clockLabel(l.e)}  ${cleanDesc(l.raw)}`;

function compare(){
  const o=state.old,n=state.new;
  const ids=[...new Set([...o.keys(),...n.keys()])].sort();
  rows=ids.map(id=>{
    const a=o.get(id),b=n.get(id);
    if(!a)return{id,type:'added',b};
    if(!b)return{id,type:'removed',a};
    const diffs=FIELDS.filter(([f,,k])=>fmt(a[f],k)!==fmt(b[f],k)).map(([f,label,k])=>{
      const delta=(k==='min'&&a[f]!=null&&b[f]!=null)?b[f]-a[f]:null;
      return{label,o:fmt(a[f],k),n:fmt(b[f],k),delta};
    });
    const ka=a.legs.map(legKey),kb=b.legs.map(legKey);
    const lo=ka.filter(k=>!kb.includes(k)),ln=kb.filter(k=>!ka.includes(k));
    const changed=diffs.length||lo.length||ln.length;
    return{id,type:changed?'modified':'same',diffs,lo,ln};
  });
  const c=t=>rows.filter(r=>r.type===t).length;
  $('summary').innerHTML=[
    ['Turni vecchi',o.size,''],['Turni nuovi',n.size,''],['Aggiunti',c('added'),'add'],
    ['Rimossi',c('removed'),'rem'],['Modificati',c('modified'),'mod'],['Invariati',c('same'),'']
  ].map(([k,v,cl])=>`<div class="sc"><div class="k">${k}</div><div class="v ${cl}">${v}</div></div>`).join('');
  $('summary').style.display='grid';
  $('controls').style.display='flex';
  render();
}

function render(){
  const q=$('q').value.trim().toUpperCase();
  const list=rows.filter(r=>r.type!=='same'&&(filter==='all'||r.type===filter)&&(!q||r.id.includes(q)));
  const labels={added:'Aggiunto',removed:'Rimosso',modified:'Modificato'};
  $('cnt').textContent=`${list.length} turni`;
  if(!list.length){$('list').innerHTML='<div class="sub">Nessuna differenza da mostrare con questi filtri.</div>';return}
  $('list').innerHTML=list.map(r=>{
    let body='';
    if(r.type==='added'||r.type==='removed'){
      const t=r.b||r.a;
      body=`<div class="sub mono">${esc(t.orario_raw)} · guida ${mmHHMM(t.guida_min)} · sosta ${mmHHMM(t.sosta_min)}${t.km_pdf?' · '+t.km_pdf+' km':''}${t.is_riserva?' · riserva':''}</div>`;
    }else{
      body='<div class="diffs">'+r.diffs.map(d=>`<div class="drow"><span>${d.label}</span><span class="o mono">${esc(d.o)}</span><span class="n mono">${esc(d.n)}</span><span class="d mono">${d.delta?(d.delta>0?'+':'−')+mmHHMM(Math.abs(d.delta)):''}</span></div>`).join('')+'</div>';
      if(r.lo.length||r.ln.length)body+=`<div class="legs">${r.lo.length?'<h4>Tratte non più presenti</h4>':''}${r.lo.map(k=>`<div class="lo">− ${esc(k)}</div>`).join('')}${r.ln.length?'<h4 style="margin-top:8px">Tratte nuove</h4>':''}${r.ln.map(k=>`<div class="ln">+ ${esc(k)}</div>`).join('')}</div>`;
    }
    return `<div class="row ${r.type}"><div class="rh"><span class="id">${r.id}</span><span class="tag">${labels[r.type]}</span></div>${body}</div>`;
  }).join('');
}
document.querySelectorAll('#controls button').forEach(b=>b.addEventListener('click',()=>{
  filter=b.dataset.f;document.querySelectorAll('#controls button').forEach(x=>x.classList.toggle('on',x===b));render();
}));
$('q').addEventListener('input',render);
</script>
</body>
</html>
